const D=[{"c": "tech", "s": "科技新報", "t": "借鏡地表最強生物抗凍蛋白，或突破人類紅血球冷凍保存難題", "b": "研究利用水熊蟲體內的抗凍蛋白搭配海藻糖，成功維持紅血球在冷凍後的狀態。團隊希望藉此突破人類紅血球冷凍保存的難題。", "u": "https://technews.tw/2026/10/11/red-blood-cell-tardigrade-cahs-protein-trehalose-centrifugation/", "p": "2026-10-11T09:49:05+00:00", "o": "借鏡地表最強生物抗凍蛋白，或突破人類紅血球冷凍保存難題", "x": "目前長期保存紅血球的做法是冷凍保存，主要依賴甘油作為冷凍保護劑，能防止冰晶形成、保護細胞膜。但甘油具細胞毒性，輸血前需先徹底移除，該步驟又會對紅血球造成損傷，對稀有血型的紅血球來說，現有保存效率限制了其應用。\n水熊蟲體內有種胞質豐富熱溶蛋白（cytosolic abundant heat-soluble，CAHS），脫水時會大量生成，這些蛋白質與海藻糖作用會形成類似玻璃的保護性結構，防止水熊蟲細胞在極端乾燥或冷凍環境下受損。\n於是團隊想知道，CAHS 蛋白+海藻糖的獨特組合保護小鼠紅血球效果是否比甘油好。\n研究人員只挑選 CAHS 蛋白其中一個具保護作用的片段，該片段與海藻糖結合後，在低溫環境能改變冰晶形成與融化方式，從而保護紅血球免受冰晶刺穿損傷。更重要的是解凍後只需透過離心法就能輕易洗去 CAHS-海藻糖混合物，無需複雜移除步驟。\n在實驗中，研究團隊將小鼠紅血球與 CAHS 片段及海藻糖混合，浸入液氮冷凍，結果顯示以新方法保存的紅血球，解凍後完整恢復率高達 89%，相較之下，以傳統甘油方法保存的紅血球恢復率約 82%。\n進一步體內測試也證實新方法的安全性及有效性，將將冷凍保存的紅血球輸血給貧血小鼠後，成功提升小鼠紅血球數量與血紅素數值且未引發發炎反應，證明該方法具良好生物相容性。\n透過借鏡水熊蟲生存機制，科學家有望開發出更安全、更高效的細胞保存技術，不過此法要實際應用於人類紅血球庫存，尚需進行更多人體試驗與長期穩定性評估。\n從這裡可透過《Google 新聞》追蹤 TechNews\n© 2013-2026 TechNews Inc. All rights reserved. | 關於我們 | 使用條款 | 隱私權政策 | 著作權與授權轉載\n您的帳戶已經在其他裝置進行登入，於是系統將自動把您的帳戶登出本裝置。"}, {"c": "tech", "s": "科技新報", "t": "美 337 調查再盯上台廠，鴻海、廣達：營運未受影響", "b": "美國國際貿易委員會對特定垂直供電系統及相關運算設備啟動 337 調查，鴻海、廣達、台達電等台廠被列入。鴻海與廣達聲明相關產品、生產營運及出貨均未受影響，將積極配合調查。", "u": "https://finance.technews.tw/2026/10/11/337-usa-victor/", "p": "2026-10-11T08:34:13+00:00", "o": "美 337 調查再盯上台廠，鴻海、廣達：營運未受影響", "x": "美國國際貿易委員會（USITC）近日針對特定垂直供電系統及相關運算設備啟動 337 調查，鴻海、廣達、台達電等台灣科技大廠均被列入調查名單。對此，鴻海與廣達分別發表聲明，強調目前相關產品、生產營運及出貨均未受到影響，後續將積極配合調查，維護公司權益。\nUSITC 是於美國時間 10 月 9 日宣布，正式啟動編號 337-TA-1526 調查，起因為美國電源技術業者 Vicor Corporation 於 9 月 9 日提出專利侵權申訴，指控部分垂直供電系統、相關零組件及搭載該技術的運算系統涉嫌侵犯其專利權，並要求發布有限排除令及停止侵權命令。\n此次調查涉及美國專利 US 10,903,734，列名企業除鴻海、廣達及台達電外，還包括英飛凌（Infineon）、立訊精密、Monolithic Power Systems（MPS）、Flex 及 Celestica 等業者，涵蓋電源管理、電子零組件及伺服器供應鏈。\n鴻海表示，該公司近日獲悉 USITC 正式啟動調查，鴻海精密及旗下富士康工業互聯網（FII）、FII USA、鴻佰科技（Ingrasys）及其美國子公司均被列為被調查方。\n鴻海強調，目前案件仍處於立案初期，USITC 僅決定啟動調查，尚未針對 Vicor 提出的專利侵權主張作出任何實質認定。該公司尊重智慧財產權，已組成專業團隊釐清相關專利及產品範圍，將依照法定程序積極應對，以維護公司及股東權益。\n針對營運影響，鴻海指出，經初步評估，本次調查目前未對鴻海及相關企業的生產營運、產品出貨及客戶合作造成重大影響，整體營運維持正常，並將持續與客戶及供應鏈合作夥伴保持溝通。\n廣達則表示，該公司高度重視智慧財產權，針對此次專利爭議調查涉及的零組件，將要求相關供應商妥適處理並積極因應，以維護公司權益。由於案件已進入調查程序，不便進一步評論，但強調相關產品與營運均未受到影響。\n依據美國 337 條款，USITC 可針對涉及專利侵權等不公平貿易行為的進口產品展開調查，若最終認定違反規定，可發布排除令，限制相關產品進口美國，或發布停止侵權命令。\nUSITC 指出，啟動調查並不代表已認定相關企業侵權，後續將由行政法官進行審理，並於立案後 45 天內設定調查完成的目標日期。鴻海也表示，後續調查結果仍存在不確定性，將持續關注案件進展及可能影響，並依法辦理資訊揭露。\n值得注意的是，這並非 Vicor 首次透過美國 337 條款針對台灣伺服器及電源供應鏈提出專利侵權申訴。該公司早在 2023 年便曾就電源轉換模組及相關運算系統提出 337 調查，涉及鴻海、廣達、台達電等業者，美國國際貿易委員會並於 2025 年 2 月針對該案發布有限排除令及部分停止侵權命令。\n此外，Vicor 於 2026 年 2 月再度針對電源轉換器、電路板組件及相關運算系統提出 337 調查，如今又有新一波專利爭議，顯示 Vicor 持續透過專利訴訟及貿易救濟程序維護其電源技術智慧財產權。不過各案件涉及的專利及產品範圍不盡相同，仍須分別認定，不能直接視為相同侵權爭議的延續。\n從這裡可透過《Google 新聞》追蹤 TechNews\n© 2013-2026 TechNews Inc. All rights reserved. | 關於我們 | 使用條款 | 隱私權政策 | 著作權與授權轉載\n您的帳戶已經在其他裝置進行登入，於是系統將自動把您的帳戶登出本裝置。"}, {"c": "tech", "s": "科技新報", "t": "目標成為 AI 代理界的麥金塔！蘋果前設計師操刀 Hark 推出主動式 AI 程式 Hark Pro，為硬體明年上市鋪路", "b": "Figure AI 創辦人阿德科克領軍的新創 Hark，推出主打「主動式」服務的 AI 應用 Hark Pro，首款硬體預計 2027 年問世。設計主管曾任蘋果工業設計師，參與過 iPhone Air。", "u": "https://technews.tw/2026/10/11/ai-startup-hark-debuts-proactive-hark-pro-app-ahead-of-2027-hardware-launch/", "p": "2026-10-11T08:30:41+00:00", "o": "目標成為 AI 代理界的麥金塔！蘋果前設計師操刀 Hark 推出主動式 AI 程式 Hark Pro，為硬體明年上市鋪路", "x": "Hark Pro 定位為「生活的作業系統」，網頁、iOS 與 Android 平台免費使用，付費方案每月 20 美元可享兩倍用量、100 美元享十倍用量，可代人採買日用品、叫車或建立試算表。\nChowdhury 認為，現今 AI 聊天機器人就像早期的命令列介面，他希望 Hark 能像當年麥金塔（Macintosh）之於個人電腦，為 AI 打造圖形使用者介面（GUI）。\nHark Pro 主畫面仍以文字輸入框為核心，左側則是「主動卡片」，使用者連結電子郵件與第三方服務後，AI 會提醒有同事等待審核、該上傳收據報帳或辦理航班報到等事項；另有類似小工具的「面板」，依 AI 記憶學到的使用者喜好顯示資訊。\n執行任務時，Hark 會啟動名為 Handoff 的雲端電腦代為操作。Chowdhury 示範透過 DoorDash 訂購麥香魚，Handoff 花了數分鐘點選網頁，最後只需使用者確認付款。他坦言簡單任務未必比較快，但若是尋找符合保險給付與評價條件的牙醫等複雜任務，AI 可同時瀏覽多個網站篩選。\nHark 也強調 AI 具備「預判」能力，例如購買電影票後，還會主動預約附近停車位並傳送入場 QR Code。隱私方面，Hark 承諾不出售使用者資料、不與廣告商分享，使用者可隨時刪除資料。\nHark 目前未透露硬體細節。Chowdhury 先前受訪時表示不會是 AI 胸針或智慧眼鏡等穿戴式裝置，消息人士也指出，公司無意將 Hark 的 AI 與 Figure 人形機器人結合。Chowdhury 認為，可靠且能主動代勞的 AI，將開啟超越筆電與手機的未來。\n從這裡可透過《Google 新聞》追蹤 TechNews\n© 2013-2026 TechNews Inc. All rights reserved. | 關於我們 | 使用條款 | 隱私權政策 | 著作權與授權轉載\n您的帳戶已經在其他裝置進行登入，於是系統將自動把您的帳戶登出本裝置。"}, {"c": "tech", "s": "科技新報", "t": "棕矮星也會變天，韋伯望遠鏡捕捉 7.5 光年外鄰居天體雲層變化", "b": "天文學家用韋伯望遠鏡連續觀測 7.5 光年外的棕矮星 WISE 0855–0714 長達 11 小時。首度證實其高空水雲厚度會隨時間變化，如同地球的天氣。", "u": "https://technews.tw/2026/10/11/wise-0855-brown-dwarf-star-atmosphere-water-cloud/", "p": "2026-10-11T08:18:46+00:00", "o": "棕矮星也會變天，韋伯望遠鏡捕捉 7.5 光年外鄰居天體雲層變化", "x": "WISE 0855–0714 最早於 2013 年發現，隔年卡內基科學研究所研究團隊觀測到 WISE 0855–0714 可能擁有水冰雲層，是目前已知最冷棕矮星（Brown dwarfs），表面溫度僅零下 13～48℃。\n最新研究發現 WISE 0855–0714 天氣變化直接證據，表明 WISE 0855–0714 高空水雲正隨該天體自轉持續變厚或變薄，同時來自深層大氣的化學氣體被對流從下向上翻湧，就像一鍋熱湯，底部熱流將物質帶到表面。\n過去儀器（如史匹哲太空望遠鏡）只能測量系外天體整體亮度，像用黑白照片看世界，無法分辨亮度變化源自「雲層變薄」還是「溫度上升」；而韋伯望遠鏡的中解析度光譜儀能針對單一分子特徵追蹤，讓科學家逐一觀察化學訊號實時變化，也因此揭示 WISE 0855–0714 雖然歸類為棕矮星（既不像行星也不像恆星），其天氣模式卻與我們熟悉的氣態巨行星高度相似。\n從我們熟悉的木星風暴，到這顆 自由漂浮的冰冷棕矮星，可能使用同一套放諸四海的基本物理過程，不僅讓我們更認識宇宙近鄰，也為韋伯太空望遠鏡解讀遙遠氣態巨行星天氣提供堅實理論基礎。\n正如研究人員所言，天氣無處不在，一些最靠近我們的鄰居，或許擁有值得我們抬頭仰望的天空。\n新論文將發表在《天文物理期刊》（The Astrophysical Journal）。\n從這裡可透過《Google 新聞》追蹤 TechNews\n© 2013-2026 TechNews Inc. All rights reserved. | 關於我們 | 使用條款 | 隱私權政策 | 著作權與授權轉載\n您的帳戶已經在其他裝置進行登入，於是系統將自動把您的帳戶登出本裝置。"}, {"c": "fin", "s": "Yahoo Finance", "t": "四年來增加 40 兆美元：為何這波 AI 驅動的牛市仍有空間", "b": "自 2022 年秋季以來，AI 投資熱潮已改變整個市場。", "u": "https://finance.yahoo.com/m/4a6ddf57-8100-34f1-89a7-923bd93d7e6d/four-years-in%2C-%2440-trillion.html?.tsrc=rss", "p": "2026-10-11T08:00:00+00:00", "o": "Four Years In, $40 Trillion Up: Why This AI-Fueled Bull Market Has Room to Run"}, {"c": "tech", "s": "科技新報", "t": "AI 代理的下道關卡，網站願不願意放行", "b": "個人 AI 代理人能替使用者訂機票、訂位、買菜，但常被網站擋下而無法完成任務，例如亞馬遜開始封鎖 Meta 的 Muse。網站是否放行，成為 AI 代理的下一道關卡。", "u": "https://infosecu.technews.tw/2026/10/11/the-next-hurdle-for-ai-agents-getting-websites-to-let-them-in/", "p": "2026-10-11T07:30:36+00:00", "o": "AI 代理的下道關卡，網站願不願意放行", "x": "有些封鎖並非刻意。社群有使用者抱怨 Muse 無法在沃爾瑪（Walmart）網站購買，但沃爾瑪發言人表示並非有意為之，沃爾瑪其實是 Muse 的合作夥伴。問題出在網站要求點擊按鈕驗證訪客是真人，流程一旦中斷，驗證就會失敗、代理遭踢出。報導認為，現在真人驗證與防垃圾機制，未必適合以 AI 代理為主的網路。\n也有業者明確不歡迎。達美航空（Delta）表示正在防範未經授權的自動化活動，目前沒有任何讓第三方代理人代訂機票的合作；聯合航空（United）則引用使用條款禁止未經許可使用機器人的規定。Yelp 表示除非代理透過資料授權計畫付費，否則不允許非人類流量；eBay 則說並未禁止所有第三方購物代理，限制的是未授權的代理與自動爬取、模型訓練等行為。\n部分人懷疑 Cloudflare 等內容傳遞網路（CDN）干擾 Muse 流量，起因是 9 月 15 日爬蟲預設值調整，但 Cloudflare 表示目前沒有數據可提供。為解決問題，Meta、沃爾瑪、Stripe、Sierra、Genesys、Rocket、NiCE 與 Decagon 等業者已著手制定開放標準，規範 AI 代理人與企業之間的溝通，以區分代表使用者的代理人與惡意機器人。Meta 表示，拒絕個人 AI 代理就等於拒絕背後的顧客。\n從這裡可透過《Google 新聞》追蹤 TechNews\n© 2013-2026 TechNews Inc. All rights reserved. | 關於我們 | 使用條款 | 隱私權政策 | 著作權與授權轉載\n您的帳戶已經在其他裝置進行登入，於是系統將自動把您的帳戶登出本裝置。"}, {"c": "tech", "s": "科技新報", "t": "丹納赫將推首座 AI 自動實驗室，抗體試劑開發最高快 8 倍", "b": "丹納赫宣布推出首座 AI 驅動的自動研究實驗室，協助科學家更快開發客製化抗體與分子工具。預計 2027 年初全面規模化運作，抗體試劑開發最高可快 8 倍。", "u": "https://technews.tw/2026/10/11/danaher-launching-ai-powered-autonomous-lab-for-drug-discovery/", "p": "2026-10-11T07:00:45+00:00", "o": "丹納赫將推首座 AI 自動實驗室，抗體試劑開發最高快 8 倍", "x": "這座實驗室設於旗下試劑供應商 Abcam，整合 AI、機器人，以及 Beckman Coulter Life Sciences、Cytiva、Genedata、Integrated DNA Technologies、Molecular Devices 等子公司的技術，串連成端到端的工作流程。儀器協調與機器人自動化部分，則與丹納赫 2026 年 1 月投資的 Automata 共同開發。\n系統先由 AI 設計可與生物標靶結合的親和性試劑，如抗體，再交由機器人製作與測試，實驗結果持續回饋給模型以改良下一輪設計，形成「設計、製作、測試、學習」的連續循環。丹納赫預估，從構想到完成驗證試劑的速度最高可提升 8 倍，每年試劑產量也可望增加至 10 倍，從數十種擴大到數百種。\n丹納赫首席科學長 JC Gutierrez-Ramos 表示，這座實驗室代表新的科學發現模式，由 AI、自動化與人類專業在持續學習的循環協同合作。他指出，速度是關鍵，每次結果都讓下個設計更精準，循環愈快，發現的累積就愈快，科學家也能把更多時間投入仍需人類判斷的複雜問題。\n執行長 Julie Sawyer Montgomery 則說，此舉是重要的一步，未來 AI、自動化與智慧系統將大幅加快從研究發現到產生實際影響的過程。\n丹納赫指出，這只是更大計畫的第一步。公司將打造一系列能產出「AI 就緒資料」的智慧儀器，搭配具專家級能力的代理式 AI 系統，再將儀器串連成整合式工作流程，建立更多自動實驗室。AI 模型可在分子製作前先篩選出較具潛力的設計，機器人讓實驗執行更一致，推動研究流程更具預測性。\n業界認為，此舉反映生命科學工具供應商正積極將 AI 與自動化整合進實驗室設備，以縮短藥物研發時程、提升實驗室生產力。\n從這裡可透過《Google 新聞》追蹤 TechNews\n© 2013-2026 TechNews Inc. All rights reserved. | 關於我們 | 使用條款 | 隱私權政策 | 著作權與授權轉載\n您的帳戶已經在其他裝置進行登入，於是系統將自動把您的帳戶登出本裝置。"}, {"c": "tech", "s": "科技新報", "t": "澳洲 UNSW 攜手 UtmoLight，大面積鈣鈦礦太陽能次模組效率達 23.5% 創世界紀錄", "b": "澳洲新南威爾斯大學與 UtmoLight 以省去氧化鎳層的製程，讓 30×30 公分鈣鈦礦太陽能次模組達到 23.5% 的認證穩定轉換效率，較先前紀錄提升 0.6 個百分點。", "u": "https://technews.tw/2026/10/11/perovskite-solar-efficiency-hits-new-record/", "p": "2026-10-11T06:30:08+00:00", "o": "澳洲 UNSW 攜手 UtmoLight，大面積鈣鈦礦太陽能次模組效率達 23.5% 創世界紀錄", "x": "由 UNSW 光電與再生能源工程學院 Scientia 教授郝曉靜所帶領的團隊，與 UtmoLight 共同締造了這項大面積鈣鈦礦太陽能次模組（Submodule）的世界紀錄。該模組尺寸為 30公分×30 公分，有效受光面積（Aperture Area）達 676 平方公分。團隊表示，雖然未公開負責認證的機構名稱，但其高達 23.5% 的穩定光電轉換效率已為業界立下全新標竿。\n此次刷新紀錄的技術關鍵，在於成功拿掉傳統製程中的「氧化鎳（Nickel Oxide）層」。過去，氧化鎳常被應用於鈣鈦礦電池與次模組中，以防止短路並確保元件正常運作。然而，它容易與鈣鈦礦材料產生不良反應而導致不穩定，且沉積該塗層也會增加製造工序。\nUNSW 團隊透過材料創新與全新的電池製作方式，不僅成功省去這道步驟，還能讓電洞選擇性接觸（Hole-selective contact）在製作過程中直接形成，順利打破了傳統逐層堆疊的限制。\n研究人員強調，這項成果大幅縮小了大面積模組與實驗室微型電池（面積通常僅約 1 平方公分）之間的效率落差。郝教授指出，這證明了鈣鈦礦技術在遠大於實驗室規模的面積上，依然能維持高效率，進一步強化了其邁向量產與應用於光電模組的潛力。\n她進一步說明：「在小型實驗室元件中表現極佳的材料，放大製程後未必會有相同的表現。因此，團隊的重點不單是尋找高效能材料，更在於設計出在大面積製造條件下，依然能發揮作用的材料與介面。」\n放眼未來，團隊的下一步是製作並測試面積達 2.8 平方公尺的「全尺寸模組」，這已相當接近現行商業光電模組的標準尺寸，目標效率設定約在 18% 至 19% 之間。儘管團隊坦言在大規模部署前，效率、再現性與長期穩定性仍需持續精進，但這項基於 UNSW 與 UtmoLight 於 2026 年初展開的產學合作，已為鈣鈦礦光電技術的產業化奠定基礎。這項合作也讓研究人員得以在早期階段評估新概念的「可放大性」，避免將多年心血耗費在不適合工業量產的材料開發上。\n從這裡可透過《Google 新聞》追蹤 TechNews\n© 2013-2026 TechNews Inc. All rights reserved. | 關於我們 | 使用條款 | 隱私權政策 | 著作權與授權轉載\n您的帳戶已經在其他裝置進行登入，於是系統將自動把您的帳戶登出本裝置。"}, {"c": "fin", "s": "Yahoo Finance", "t": "更好的 Invesco 醫療保健 ETF：聚焦製藥的 PJP 對比視野更廣的 RSPH", "b": "PJP 的一年期報酬勝過 RSPH，但 RSPH 持有 61 檔醫療保健股，分散度更高、費用率更低。", "u": "https://www.fool.com/coverage/etfs/2026/10/11/better-invesco-healthcare-etf-pjp-targeting-pharmaceuticals-vs-rsph-s-broader-sector-lens/?.tsrc=rss", "p": "2026-10-11T06:13:48+00:00", "o": "Better Invesco Healthcare ETF: PJP Targeting Pharmaceuticals vs. RSPH's Broader Sector Lens"}, {"c": "tech", "s": "科技新報", "t": "台股 5 萬點前高檔震盪，渣打：企業獲利跑贏股價，漲勢仍有基本面支撐", "b": "台股在全球資金與 AI 權值股帶動下屢創新高，距離 5 萬點僅一步之遙，但在關卡前高檔震盪。渣打認為企業獲利跑贏股價，漲勢仍有基本面支撐。", "u": "https://finance.technews.tw/2026/10/11/what-driving-taiwan-stocks-toward-50000/", "p": "2026-10-11T06:00:00+00:00", "o": "台股 5 萬點前高檔震盪，渣打：企業獲利跑贏股價，漲勢仍有基本面支撐", "x": "回顧10月5日，台股加權指數狂飆 1,236.3 點，終場收在 49,712.04 點，台指期夜盤更一度衝破 50,265 點大關。\n市場頓時歡欣鼓舞，預期隔日便能順勢站上5萬點的歷史紀錄。然而，之後的盤勢卻遭遇獲利了結賣壓，7日終場收在49,806.37點，在5萬大關前陷入高檔震盪。\n渣打銀行財富管理投資策略部主管劉家豪指出，第四季市場短期波動勢必升高。\n另外，也有投資人擔憂股市創高後「太貴」。劉家豪對此分析，今年全球主要股市的上漲背後，都有強勁的盈餘支撐。如輝達股價屢創新高，但因獲利能見度極高，獲利成長的速度超越股價漲幅，導致本益比反而從年初的30倍下修至20到25倍，這代表目前股市上漲具備合理的評價基礎，企業獲利尚能跑贏股價。\n此外，渣打銀行預估，至2030年前，AI相關資本支出的年複合成長率將超過30%。AI的投資主題正由純科技產業延伸至實體經濟，除了半導體持續受惠，隨著運算需求激增，電力供應、電網升級與電氣化等基礎建設的重要性同步提高。\n在總體經濟方面，劉家豪表示，AI投資與企業資本支出，持續支撐全球經濟活動，預期經濟「軟著陸」仍是機率最高的基準情境（機率45%），而不著陸及下行情境的機率則分別為30%及25%。\n值得留意的是，第四季最大的跨資產風險指標在於「油價」。受地緣政治衝突與供應中斷風險影響，渣打已將西德州中級原油（WTI）三個月預測上調至每桶100美元。\n油價若持續高漲，甚至進一步攀升至每桶120至150美元區間，將重新推高通膨壓力，打亂聯準會的貨幣政策步調並增加經濟下行風險。\n由於聯準會（FED）仍可能進一步升息，因此，劉家豪提醒，長天期公債殖利率的波動風險依然較高，預期美國10年期公債殖利率至明年初，多數時間將維持在特定高檔區間震盪。\n因此，以投資配置而言，相對看好「新興市場美元政府債」，對已開發國家公債則維持審慎看法。企業債方面，投資等級與非投資等級債券皆可提供穩健收益。為平衡收益與利率風險，渣打則偏好3至7年期的「短中天期債券」，也建議投資人以「穩定票息收入」為核心，強化發行人篩選與分散配置，以提升防禦力。\n短期內，聯準會若進一步收緊政策將支撐美元，三個月美元指數預測為 100.2；但中長期而言，隨通膨壓力緩和及歐洲央行與日本央行進一步收緊政策，美日、美歐利差收斂，未來12個月美元指數，可能回落至98。其中，若日本延續貨幣政策正常化，日圓將是潛在的中期受益貨幣。\n至於金價後市怎麼觀察？劉家豪指出，儘管高利率短暫壓抑金價，但全球主要央行（如中國、波蘭等）為分散外匯儲備風險，持續穩健買入黃金。在央行買盤支撐及美元中期升值空間有限的背景下，渣打預期黃金3個月及12個月目標價，將分別上看每盎司4,750美元及5,000美元，持續扮演避險與分散風險的重要角色。\n劉家豪提到，第四季金融市場雖面臨選舉、油價與央行政策等短期干擾，但「企業獲利」將決定中長期方向的核心。面對台股挑戰5萬點的契機與震盪加劇的環境，投資人應透過「股優於債」的多元資產配置、分批布局，並適度納入黃金與短中天期債券做為防禦。\n（本文由 遠見雜誌 授權轉載；首圖來源：Magnific）\n從這裡可透過《Google 新聞》追蹤 TechNews\n© 2013-2026 TechNews Inc. All rights reserved. | 關於我們 | 使用條款 | 隱私權政策 | 著作權與授權轉載\n您的帳戶已經在其他裝置進行登入，於是系統將自動把您的帳戶登出本裝置。"}, {"c": "fin", "s": "WSJ", "t": "讓私募信貸崛起的沉悶保險產品", "b": "指數型年金保證不虧損，但保險公司可定期調整報酬公式。", "u": "https://www.wsj.com/finance/the-sleepy-insurance-product-that-came-to-power-private-credits-ascent-e9586fa3?mod=rss_markets_main", "p": "2026-10-11T02:46:00+00:00", "o": "The Sleepy Insurance Product That Came to Power Private Credit’s Ascent"}, {"c": "pol", "s": "WSJ", "t": "飢餓的烏克蘭人冒死逃離前線小鎮", "b": "整年來糧食供應日益短缺，地雷與無人機讓道路愈來愈難以通行。", "u": "https://www.wsj.com/world/starving-ukrainians-are-risking-death-to-escape-their-front-line-town-69262dbb?mod=rss_worldnews", "p": "2026-10-11T02:00:00+00:00", "o": "Starving Ukrainians Are Risking Death to Escape Their Front-Line Town"}, {"c": "tech", "s": "WSJ", "t": "如何保護你的網路攝影機不被窺探", "b": "弱密碼、過時軟體與不佳的 Wi-Fi 安全，可能讓陌生人入侵你家中的攝影機。", "u": "https://www.wsj.com/tech/personal-tech/how-to-keep-your-webcam-safe-from-prying-eyes-20c05b74?mod=rss_Technology", "p": "2026-10-11T00:57:00+00:00", "o": "How to Keep Your Webcam Safe From Prying Eyes"}, {"c": "pol", "s": "WSJ", "t": "監視攝影機無所不在，如今成為戰爭中的駭客目標", "b": "這些高度脆弱的設備已被交戰方用來追蹤、監視與攻擊敵人。", "u": "https://www.wsj.com/tech/cybersecurity/video-cameras-webcams-hacked-war-b00b8a24?mod=rss_worldnews", "p": "2026-10-11T00:30:00+00:00", "o": "Video Cameras Are Everywhere—and Now They Are Being Hacked for War"}, {"c": "fin", "s": "財經新報", "t": "汽車百貨龍頭 10 月登興櫃，車麗屋靠「零庫存換胎」策略打造全新加盟生態圈", "b": "汽車百貨龍頭車麗屋 10 月登興櫃，面臨展店瓶頸。公司靠取得 Point S 台灣獨家總代理，並跨足兩家商場經營，尋求再成長。", "u": "https://finance.technews.tw/2026/10/11/car-quality-automotive-expands-its-footprint/", "p": "2026-10-11T00:00:18+00:00", "o": "汽車百貨龍頭 10 月登興櫃，車麗屋靠「零庫存換胎」策略打造全新加盟生態圈", "x": "30年前，台灣汽車百貨多為20坪街邊小店，身為後進者的車麗屋董事長卓豐閔（見首圖），卻決定反其道而行，砸下1,660萬元，開出全台最大的500坪店面，轟動市場。\n30年後，以大坪數打開知名度的車麗屋，成為擁有30多家直營店的行業龍頭，不但據點數是對手新焦點麗車坊、真便宜汽車百貨的三倍之多，門市汽車零件品項高達14萬種，足足比對手多一倍；規模大也讓車麗屋採購時額外取得兩成折扣；到今年，累積會員數突破180萬。\n只是，一向靠大店策略立足市場的車麗屋，如今面臨擴張最大的限制──符合條件的大坪數土地，愈來愈難找。\n「除了店面至少要500坪，地區人口要十萬人，土地所在的街邊馬路還得是四線道、下班車潮會經過之處！」卓豐閔接受《今周刊》專訪時直言，過去這套選址「勝利方程式」，是車麗屋做大的關鍵，但隨著土地難尋、租金不斷上升，開始遭遇展店瓶頸。\n攤開財報，受惠車齡提高帶動保修剛需，車麗屋去年營收18.2億元，又以輪胎業務占最大宗，每股稅後純益（EPS）7.07元；今年上半年營收9.4億元，年增4%，EPS 4.08元，全年營收、獲利仍有望創高，預計於10月13日登興櫃。\n「車麗屋生意穩定，但缺乏爆發性成長」，與車麗屋合作超過十年的輪胎業者觀察。\n那要怎麼把生意做更大？卓豐閔的第一個答案，是與國際汽車快速保養巨頭、以更換輪胎見長的Point S合作。\n2024年，Point S欲擴大布局亞洲市場，花了半年時間考察台灣汽車售後維修市場（AM），並先後接觸包括車麗屋在內約十家潛在合作對象。雙方前後歷經五回合面談，最後車麗屋憑著大型門市的採購和庫存經驗、自建資訊系統、會員經營等實力，取得Point S台灣獨家總代理權。\n「我可以把咖啡煮得很好喝，但跟星巴克合作還是有它的價值」，卓豐閔如此比喻，Point S在全球五十多國成立超過七千個營業據點，擁有經過多年市場驗證的服務標準與加盟制度，合作後有助於打造加盟環境。他為此擬定「368計畫」，透過開放加盟，讓車麗屋的服務網延伸到全台368個鄉鎮市區。\n對加盟者而言，花百萬元加盟的效益，在於不必擔心輪胎庫存問題，消費者線上下單、選定安裝店後，車麗屋透過系統調度，從最近直營店出貨到合作據點。「以前消費者換輪胎要等三天，現在隔天就能換完」，卓豐閔說。\n一年前，車麗屋與台灣知名汽車輪胎維修品牌「輪胎大師」合作，透過其十多個據點熱身。「這創造多贏！」輪胎大師總經理洪耀南分析，加盟店不必承擔成千上萬條庫存壓力，消費者也有更多產品選擇，試行期間每日業績增加三成；對車麗屋來說，導入Point S的加盟制度，不但新增加盟與銷售收入，還加速拓展鄉鎮服務據點與知名度，更可透過系統串接掌握交易大數據。\n惟卓豐閔坦言，試行以來發現消費者對輪胎規格不熟，容易下錯單，因此正著手導入AI客服降低錯單。加盟店則預計明年下半年陸續上路，估計單店月營收有望達百萬元。\n從這裡可透過《Google 新聞》追蹤 TechNews\n© 2013-2026 TechNews Inc. All rights reserved. | 關於我們 | 使用條款 | 隱私權政策 | 著作權與授權轉載\n您的帳戶已經在其他裝置進行登入，於是系統將自動把您的帳戶登出本裝置。"}, {"c": "pol", "s": "WSJ", "t": "胡塞武裝襲擊沙烏地機場，至少 12 死、數百人受傷", "b": "飛彈攻擊迫使沙國國際機場關閉，是該國十多年來最致命的攻擊。", "u": "https://www.wsj.com/world/middle-east/iran-backed-houthis-hit-saudi-capitals-airport-in-damaging-new-attack-d4c12236?mod=rss_worldnews", "p": "2026-10-10T23:28:00+00:00", "o": "At Least 12 Killed, Hundreds Injured at Saudi Airport in Houthi Strikes"}, {"c": "fin", "s": "Yahoo Finance", "t": "標普 500 中一檔 COVID 疫苗股今年飆漲 600%", "b": "Moderna 股價今年上漲 663%，超越 AI 概念股成為標普 500 漲幅冠軍，完整的癌症疫苗數據將於 10 月 24 日公布。", "u": "https://beincrypto.com/moderna-stock-best-sp-500-2026/?.tsrc=rss", "p": "2026-10-10T22:23:54+00:00", "o": "A COVID Vaccine Stock on the S&P 500 Is Up 600% This Year"}, {"c": "tech", "s": "WSJ", "t": "美軍沙漠科技測試顯示 AI 戰爭仍有漫漫長路", "b": "一場沙漠試驗暴露出裝備限制與體制障礙，使美軍在跟上擅長 AI 的對手時步履維艱。", "u": "https://www.wsj.com/tech/the-u-s-armys-desert-tech-test-shows-long-road-to-ai-warfare-2fc2ba1e?mod=rss_Technology", "p": "2026-10-10T22:11:00+00:00", "o": "The U.S. Army’s Desert Tech Test Shows Long Road to AI Warfare"}, {"c": "fin", "s": "Yahoo Finance", "t": "VOO 不持有 SpaceX、台積電、三星電子、SK 海力士或 ASML，這檔 Vanguard ETF 則有", "b": "部分全球最重要的 AI 股票明顯不在標普 500 之中。", "u": "https://www.fool.com/investing/2026/10/10/voo-doesnt-own-spacex-taiwan-semiconductor-samsung/?.tsrc=rss", "p": "2026-10-10T20:51:33+00:00", "o": "VOO Doesn't Hold SpaceX, Taiwan Semiconductor, Samsung Electronics, SK Hynix, or ASML. Meet the Vanguard ETF That Does."}, {"c": "pol", "s": "WSJ", "t": "川普要求烏克蘭停止攻擊俄羅斯煉油廠，並更換澤倫斯基", "b": "隨著俄羅斯加強轟炸烏克蘭城市，白宮與基輔的關係跌至新低。", "u": "https://www.wsj.com/world/trump-calls-on-ukraine-to-stop-hitting-russian-refineriesand-replace-zelensky-cc9bada8?mod=rss_worldnews", "p": "2026-10-10T20:00:00+00:00", "o" 採光等屋況條件，眼見為憑，較能降低期待落差，且五年內新古屋，屋況仍新，價格也具競爭力，對有立即入住、換屋需求的客群來說，相對更符合需求。\n進一步觀察六都價差，以台中市預售及新古大樓價差最高，預售屋每坪約 58 萬元，而中古大樓單坪約 35.4 萬元，約是預售價打 6 折，價差達 22.6 萬元；反觀桃園、高雄市價差最小，只有僅 5 萬的價差。\n台灣房屋集團趨勢中心經理李家妮表示，台中近年受產業聚落、重劃區建設支撐，像是七期、水湳經貿園區等大型開發區，吸引建商大舉進駐推案，高端新案、品牌建商集中，市場推案量大，尤其熱門重劃區價格容易一案比一案高，推升預售價格持續衝高，拉大預售與新成屋的價差。\n李家妮指出，由於目前預售推案單價走高，考量總價接受度，規劃坪數也越來越小，對偏好新屋的育兒家庭來說，新古屋相較預售屋價格更容易入手，有機會以相同預算換取更大的居住空間，而像桃園、高雄這類價格差距不大的市場，對偏好新屋的購屋族，購屋選擇相對更為多元。\n從這裡可透過《Google 新聞》追蹤 TechNews\n© 2013-2026 TechNews Inc. All rights reserved. | 關於我們 | 使用條款 | 隱私權政策 | 著作權與授權轉載\n您的帳戶已經在其他裝置進行登入，於是系統將自動把您的帳戶登出本裝置。"}, {"c": "fin", "s": "財經新報", "t": "台股高檔震盪「高息型」最吃香！盤點 12 檔 ETF 規模逆勢創新高", "b": "台股大盤創高後拉回整理，CMONEY 統計有 12 檔 ETF 規模創新高，以高息型為主，包含 00927、00878、0056。其中 00927 今年以來含息上漲 107.36%。", "u": "https://finance.technews.tw/2026/10/10/high-interest-type/", "p": "2026-10-10T07:20:05+00:00", "o": "台股高檔震盪「高息型」最吃香！盤點 12 檔 ETF 規模逆勢創新高", "x": "台股大盤創高後拉回整理，但根據 CMONEY 統計顯示，包括群益半導體收益（00927）、國泰永續高股息（00878）、元大高股息（0056）在內有 12 檔規模創新高，其中以市值、高息型為主，進一步觀察這 12 檔今年以來含息績效表現，00927 上漲 107.36% 績效翻倍居冠。\n群益投信台股研究團隊表示，現階段大盤頻創新高，接下來面臨的挑戰更為複雜，台股類股輪動快速、個股波動性大，預期台股指數傾向高檔震盪，建議投資人可以透過高股息 ETF 來為投組增加抗震力，具低波動特性、可兼顧收益需求，還有 AI 熱潮所帶來的潛在資本利得可期。\n群益半導體收益 ETF 經理人謝明志表示，台股高股息 ETF 的特性偏向高配息兼具成長性的股票，涵蓋全產業配置能兼顧多元產業紅利，而台灣半導體 8 月營收年增 61% 大幅優於歷史平均，第三季在 AI 先進製程與高階封測驅動，晶圓代工與封測營收預估季增 15% 至 20%。\n謝明志指出，第四季受惠旺季動能延續，族群營收估維持雙位數季增，台灣作為 AI 產業關鍵供應鏈，無論是先進代工、封裝等半導體電子產業相關供應鏈營運有望持續受惠，台股盤勢仍有望迎接第四季傳統股市旺季上漲契機。\n從這裡可透過《Google 新聞》追蹤 TechNews\n© 2013-2026 TechNews Inc. All rights reserved. | 關於我們 | 使用條款 | 隱私權政策 | 著作權與授權轉載\n您的帳戶已經在其他裝置進行登入，於是系統將自動把您的帳戶登出本裝置。"}, {"c": "fin", "s": "財經新報", "t": "鑽石跌落神壇！年輕世代不再執著「天然的尚好」，鑽石價值遭遇大挑戰", "b": "網友在 Threads 指出鑽石價格崩盤，引發討論。De Beers 陷入巨虧，7 月暫停南非最大鑽石礦場運作，年輕世代也不再執著天然鑽石。", "u": "https://finance.technews.tw/2026/10/10/diamond-no-longer-untouchble/", "p": "2026-10-10T06:00:02+00:00", "o": "鑽石跌落神壇！年輕世代不再執著「天然的尚好」，鑽石價值遭遇大挑戰", "x": "最近Threads某女網友感嘆：「因為換了地方工作，意外得知鑽石崩盤，實驗室鑽和天然鑽無異。現在是戒台都比鑽石貴的時候，真的是好險我存的都是黃金。」\n結果，這則貼文意外吸引1,400多個讚與近百則留言。有人同意這名Threads網友的說法，認為人工培育鑽石與天然鑽石難以分辨，沒有必要選擇天然鑽石；也有人認為鑽石回收行情不佳，質疑鑽石過往的稀有價值根本是業者包裝出來的。究竟哪一個才是真相？\n鑽石價格真的崩盤了嗎？《CNBC》報導，確實如此。現在1克拉天然鑽石的價格，自2022年3月約1萬美元的高點下跌約60%，也就是說，現在1克拉鑽石批發價僅約4,000美元。不過，實際售價還要考量克拉、顏色、淨度、切工等因素。\n全球知名鑽石分析師澤姆斯基（Paul Zimnisky）也認為，鑽石價格長期走跌。他引用自己編製的天然毛坯鑽石價格指數最新數據指出，全球毛坯鑽石價格比十年前低40%。\n他分析2021~2022年疫情期間，人們無法外出，旅遊業與餐廳也受到限制，加上各國推出消費刺激措施，鑽石需求一度推至歷史新高，之後價格便一路下跌。這幾年許多商品都在漲價，鑽石卻是少數價格下跌的商品。\n至於手上有鑽戒的人，現在若想出售，行情也不好嗎？中國《海報》新聞記者2月尋找回收商的實測報導，她將2019年花約1萬人民幣購買的30分鑽戒，以及鑲嵌鑽石的18K金戒台，一起提供給珠寶回收商估價，結果回收商報價不到2,600人民幣。\n更殘酷的是，回收商報價以18K金打造的戒台就占1,700多人民幣，代表鑽石價值僅剩約800人民幣。不只與當年萬元入手價格差距甚大，也如前述Threads網友所說，可能因金價上漲，現在鑽石比戒台更難保值。\n回收商也指出，碎鑽現在基本上沒有人收，一般行情約原價四至六折，只有1克拉以上的天然鑽石才有像樣的回收價，多落在三至六成。分析師澤姆斯基7月接受《Marketplace》採訪時坦言，現在除非是高階彩鑽，否則不建議將鑽石視為投資。\n鑽石價格慘跌，也迫使De Beers 7月宣布，暫停南非最大的鑽石礦場生產兩年。2025年基礎EBITDA虧損已達5.11億美元，母集團英美資源早在2024年就公開尋找買家，試圖脫手De Beers，從過往榮光看來令人不勝唏噓。\nDe Beers曾開創20世紀的鑽石高價風潮，當年行銷策略至今看來仍相當有創意。這家鑽石商曾被美國政府懷疑壟斷市場，也曾被哈佛商學院納入教材。\nDe Beers於1888年由英國商人羅茲（Cecil John Rhodes）在南非創立，在羅斯柴爾德家族出資扶植下崛起。1926年，創辦英美資源集團的德國商人歐本海默（Sir Ernest Oppenheimer）出任主席，並1929年取得控制權，從此逐步奠定De Beers鑽石市場的霸主地位。\n不過，美國1930年代陷入大蕭條，當時人們因股市崩盤，購買珠寶首飾的意願降低，一度導致業績下滑。De Beers也在1938年決定聘用廣告公司N.W. Ayer，啟動美國市場行銷，從此一步步打造鑽石光輝稀有的形象。\n他們怎麼做？美國公共電視PBS調查性新聞節目《Frontline》某集〈鑽石帝國〉深度探討De Beers崛起祕辛。De Beers一開始是善用好萊塢影星的光環，聘請公關專家聯繫好萊塢電影製作人，請他們將鑽石置入電影情節，例如男主角送鑽石給女主角，為驚喜的浪漫求婚儀式。\n另外，De Beers聯繫好萊塢女星，讓她們在公開活動儘量展示De Beers的鑽石。如以〈英宮艷史〉成名、本身就熱愛蒐集名貴珠寶的英國演員奧蓓朗（Merle Oberon）就是其一。\nSARAH KANJ（@davincicode7）分享的貼文\nDe Beers甚至要求片商改變電影片名。一部描述鑽石竊賊的電影，原片名是〈鑽石很危險〉（Danger Diamonds），後來改為〈鑽石歷險記〉（Adventure in Diamonds），並修改多處呈現鑽石的情節。\n接著1947年，N.W. Ayer廣告公司為De Beers打造經典廣告文案「鑽石恆久遠」（A diamond is forever），至此奠定De Beers的品牌地位，以及全球男性用鑽戒求婚的傳統。《BBC》統計，二戰前僅10%訂婚戒指鑲有鑽石，但到20世紀末，鑽戒比例高達八成。\n不過，De Beers長年涉嫌壟斷市場。美國調查記者艾普斯坦（Edward Jay Epstein）著作《The Rise and Fall of Diamonds》披露，De Beers透過英美資源集團交叉持股控制市場。全球約八成寶石級原石，經由倫敦Charterhouse Street的Central Selling Organisation分級配售。合格的特約看貨商不到200家，方便控制配額。\n艾普斯坦認為，De Beers一方面限制開採、切割與進入零售市場，另一方面卻透過廣告文案訴諸「鑽石恆久遠」，其實是為了避免鑽石被變賣、流入二手市場而打壞價格。因此，De Beers熱愛強打鑽石代表永恆愛情，要人們持有一輩子。\n2000年，哈佛商學院也將De Beers一世紀多以來主導國際鑽石市場，以及在美國因壟斷嫌疑與司法部展開攻防的過程，寫入管理教材。\n無論如何，如今天然鑽石的需求與價格已大不如前。人工培育鑽石與中國競爭對手崛起，都是破壞市場的主要原因。培育鑽（laboratory-grown diamond，LGD）是什麼？簡單來說，這是實驗室透過高溫高壓或化學氣相沉積法培育的鑽石，成分是純碳，與天然鑽石相同，業界也稱為合成鑽石。\n分析師澤姆斯基表示，現在到珠寶店就能找到比同等級天然鑽石便宜高達90%~95%的培育鑽，平價是最大的吸引力。\n《CNBC》報導，2026年美國訂婚戒指銷售，高達61%是培育鑽石。婚禮網站《The Knot》去年進行鑽石調查，發現22%的Z世代、28%的Y世代年輕人認為，鑽石是否為天然鑽石一點也不重要。新世代認為，相同預算下，克拉數能更大，戴著更耀眼就好。天然鑽石的神話崩塌中。\nDe Beers曾經想擁抱培育鑽風潮，2018年推出旗下培育鑽品牌Lightbox，原本每克拉定價800美元。但中國業者以低價策略打進市場，河南柘城與鄭州如今是全球培育鑽的主要產地，七年來讓培育鑽批發價下跌九成。\n如今，同業丹麥珠寶商Pandora自2021年起已完全停用開採鑽石，全面改用培育鑽。De Beers又該如何翻身？\n分析師澤姆斯基則認為，許多消費者仍比較想要天然鑽石，但大多數消費者很難分辨兩者，因此很難說服人們多花十倍價格購買天然鑽石。對只想買一件好看、弄丟也不心疼的珠寶消費者來說，培育鑽是"}, {"c": "fin", "s": "財經新報", "t": "訂單滿手擠爆產線！智崴砸 24 億併 Flyover 通吃沉浸式娛樂產業鏈", "b": "智崴 9 月營收 2.93 億元，月減 16.2%、年增 124.19%，其中併購的 Flyover 貢獻約 1.13 億元。預估高雄橋科一期新廠產能將是目前的 4 倍。", "u": "https://finance.technews.tw/2026/10/10/flyover/", "p": "2026-10-10T05:21:37+00:00", "o": "訂單滿手擠爆產線！智崴砸 24 億併 Flyover 通吃沉浸式娛樂產業鏈", "x": "智崴資訊公告 9 月營收 2.93 億元，月減 16.2%，年增 124.19%，其中本業營收約 1.8 億元，Flyover 貢獻約 1.13 億元，顯示併購國際飛行劇院品牌 Flyover 的效應發酵，預估高雄橋科一期新廠產能將是目前的 4 倍，象徵訂單的飽滿程度。\n智崴資訊董事長歐陽志宏表示，收購 Flyover 將使得原本以飛行劇院設備銷售為主的模式，往內容開發、終端營運延伸，並將提升品牌能見度與長期價值，而從產業角度分析，代表智崴資訊正在把沉浸式娛樂的價值鏈往前後兩端同時拉長，形成更完整的商業模式。\n智崴資訊第三季合併營收達 8.4 億元，年增 141%；累計今年前 9 月營收達 17 億元，年增 85%，歐陽志宏指出，顯示智崴資訊體質已逐漸改變，預估高雄橋科一期新廠產能將是目前的 4 倍左右，象徵訂單的飽滿程度。\n飛行劇院國際品牌 Flyover，營運據點包含加拿大溫哥華、冰島雷克雅維克、美國拉斯維加斯及芝加哥，成立以來累計接待旅客逾 900 萬人次，而智崴以 24 億元收購其 100% 股權，Flyover 從 8 月開始貢獻營收 1.7 億元，並在 9 月挹注 1.13 億元，相信第三季合併後，對財務業務將有正面助益。\n設備方面，既有體感娛樂設備專案持續推進，而新接專案涵蓋美國、越南、巴西及中東等市場，產品包括大型體感遊樂設備、互動式劇場、沉浸式劇院，以及多款飛行劇院系統，歐陽志宏指出，未來將陸續進入執行，依進度認列營收。\n從這裡可透過《Google 新聞》追蹤 TechNews\n© 2013-2026 TechNews Inc. All rights reserved. | 關於我們 | 使用條款 | 隱私權政策 | 著作權與授權轉載\n您的帳戶已經在其他裝置進行登入，於是系統將自動把您的帳戶登出本裝置。"}, {"c": "fin", "s": "財經新報", "t": "AI 軍備競賽關鍵是電力！阿波羅電力採購特斯拉 1GWh 大型儲能設備", "b": "阿波羅電力與台灣特斯拉能源簽約，採購約 1GWh、共 260 台 Tesla Megapack 儲能設備。並與群聯、技嘉、士林電機啟動「AIDC 暨企業強韌電網合作」。", "u": "https://finance.technews.tw/2026/10/10/1gwh/", "p": "2026-10-10T03:42:58+00:00", "o": "AI
